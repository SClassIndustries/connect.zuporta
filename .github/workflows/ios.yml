name: iPhone artifacts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: Export a signed IPA for manual upload (requires mobile-signing environment)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Apple SDK requirement
        run: |
          xcodebuild -version
          python3 -c 'import subprocess; v=subprocess.check_output(["xcodebuild", "-version"],text=True).split()[1]; assert int(v.split(".")[0]) >= 26'
      - run: npm ci
      - run: npm run sync:ios
      - name: Swift static checks
        run: |
          if ! command -v swiftlint >/dev/null; then brew install swiftlint; fi
          swiftlint version
          swiftlint lint --strict --config .swiftlint.yml
      - name: Compile and analyze unsigned iPhone archive
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData -archivePath build/Zuporta-unsigned.xcarchive CODE_SIGNING_ALLOWED=NO archive analyze | tee build-ios.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zuporta-plus-ios-unsigned-validation-${{ github.sha }}
          path: |
            build/Zuporta-unsigned.xcarchive
            build-ios.log
          if-no-files-found: error
          retention-days: 7
  signed-ipa:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref == 'refs/heads/jet/kind-maxwell-nzz6vr'
    needs: validate
    environment: mobile-signing
    runs-on: macos-26
    timeout-minutes: 40
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Prepare distribution signing
        run: python3 scripts/prepare-signing.py ios
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      - name: Archive and export for manual upload
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/Zuporta.xcarchive DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" OTHER_CODE_SIGN_FLAGS="--keychain $IOS_SIGNING_KEYCHAIN" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          xcodebuild -exportArchive -archivePath build/Zuporta.xcarchive -exportOptionsPlist "$IOS_EXPORT_OPTIONS" -exportPath build/ipa
          codesign --verify --deep --strict build/Zuporta.xcarchive/Products/Applications/App.app
          python3 scripts/artifact-manifest.py ios-signed build/ipa --require-signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zuporta-plus-apple-upload-${{ github.sha }}
          path: |
            build/ipa/*.ipa
            build/Zuporta.xcarchive/dSYMs
            build/ios-signed.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: python3 scripts/prepare-signing.py clean
