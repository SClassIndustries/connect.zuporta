name: Android artifacts
on:
  push:
    paths-ignore: ['store/**', '*.md']
  pull_request:
    paths-ignore: ['store/**', '*.md']
  workflow_dispatch:
    inputs:
      signed:
        description: Produce a signed AAB for manual upload (requires mobile-signing environment)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      ANDROID_HOME: /tmp/zuporta-android-sdk
      ANDROID_SDK_ROOT: /tmp/zuporta-android-sdk
      ANDROID_USER_HOME: /tmp/zuporta-android-user
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - run: python3 scripts/setup-android-sdk.py
      - name: Compile debug APK, unsigned bundle and lint both variants
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:bundleRelease :app:lintDebug :app:lintRelease --no-daemon --console=plain --max-workers=2
      - name: Artifact checksums
        run: |
          python scripts/check-android-bundle.py
          python scripts/artifact-manifest.py android-validation android/app/build/outputs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zuporta-plus-android-validation-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-*
            build/android-validation.json
          if-no-files-found: error
          retention-days: 14
  signed-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref == 'refs/heads/jet/kind-maxwell-nzz6vr'
    needs: validate
    environment: mobile-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      ANDROID_HOME: /tmp/zuporta-android-sdk
      ANDROID_SDK_ROOT: /tmp/zuporta-android-sdk
      ANDROID_USER_HOME: /tmp/zuporta-android-user
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - run: python3 scripts/setup-android-sdk.py
      - name: Prepare upload keystore
        run: python scripts/prepare-signing.py android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build signed bundle (no upload)
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain --max-workers=2
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ZUPORTA_BUILD_NUMBER: ${{ github.run_number }}
      - name: Verify signed artifact
        run: |
          python scripts/check-android-bundle.py
          python scripts/artifact-manifest.py android-signed android/app/build/outputs --require-signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zuporta-plus-play-upload-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            build/android-signed.json
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: python scripts/prepare-signing.py clean
