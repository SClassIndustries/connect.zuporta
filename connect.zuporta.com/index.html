<script>
  // Theme before first paint, so it never flashes.
  try {
    var t = localStorage.getItem('zuporta.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
  // Chrome can fire this before the module finishes loading, so catch it here
  // and let the app pick it up. Without this the install button never appears.
  window.__zupInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__zupInstall = e;
    window.dispatchEvent(new Event('zup:installable'));
  });

  // Service worker lives here rather than in the module: if the module ever
  // fails to run, registration and the recovery reload below must still work.
  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    // A worker taking over mid-session means this page was loaded with the
    // previous worker's assets. Reload once so markup and code match again.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloaded) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  /* ------------------------------------------------------------------
     Watchdog + visible error reporting.

     Lives inline, and uses only inline styles, so it still works when the
     module fails to run or the stylesheet never arrives. iOS Safari keeps
     its own service worker registration and cache, entirely separate from
     other browsers on the same phone, so it can be left holding a stale
     build long after every other browser has moved on. If the app has not
     rendered shortly after load, clear everything once and reload.
     ------------------------------------------------------------------ */
  (function () {
    var RESET_KEY = 'zuporta.selfheal';
    var reported = false;

    function panel(message) {
      if (reported) return;
      reported = true;
      var box = document.createElement('div');
      box.setAttribute('role', 'alert');
      box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;'
        + 'background:#fff;color:#10202E;border-top:2px solid #2C63A8;padding:16px;'
        + 'font:14px/1.5 -apple-system,system-ui,sans-serif;max-height:60vh;overflow:auto';
      var h = document.createElement('p');
      h.textContent = 'Zuporta+ could not start on this browser.';
      h.style.cssText = 'font-weight:700;margin:0 0 6px';
      var m = document.createElement('p');
      m.textContent = message;
      m.style.cssText = 'margin:0 0 12px;color:#56697B;word-break:break-word';
      var b = document.createElement('button');
      b.textContent = 'Reset and try again';
      b.style.cssText = 'min-height:44px;padding:10px 18px;border:0;border-radius:999px;'
        + 'background:#2C63A8;color:#fff;font-weight:600;font-size:15px';
      b.onclick = function () { hardReset(true); };
      box.appendChild(h); box.appendChild(m); box.appendChild(b);
      (document.body || document.documentElement).appendChild(box);
    }

    function hardReset(force) {
      var jobs = [];
      if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(jobs)['catch'](function () {}).then(function () {
        if (force) { try { sessionStorage.removeItem(RESET_KEY); } catch (e) {} }
        location.reload();
      });
    }

    window.addEventListener('error', function (e) {
      var where = (e.filename || '').split('/').pop();
      panel((e.message || 'Script error') + (where ? ' — ' + where + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      panel('Unhandled: ' + ((r && r.message) || r));
    });

    window.addEventListener('load', function () {
      setTimeout(function () {
        var view = document.getElementById('view');
        if (!view || view.children.length > 0) return;   // rendered fine
        var tried;
        try { tried = sessionStorage.getItem(RESET_KEY); } catch (e) { tried = null; }
        if (!tried) {
          try { sessionStorage.setItem(RESET_KEY, '1'); } catch (e) {}
          hardReset(false);                              // stale cache: heal silently
        } else {
          panel('The app loaded but did not start, even after clearing its cache.');
        }
      }, 2500);
    });
  })();
</script>

<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <!-- ───────────────────────── navigation ───────────────────────── -->
  <aside class="nav" id="nav" aria-label="Main navigation">
    <div class="nav__head">
      <span class="brand">
        <svg class="brand__mark" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-mark"/></svg>
        <span class="brand__word">Zuporta<span class="brand__plus">+</span></span>
      </span>
      <button class="icon-btn nav__close" id="nav-close" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>

    <nav class="nav__scroll" aria-label="Sections">
      <ul class="nav__list" id="nav-list"></ul>
    </nav>

    <div class="nav__foot">
      <button class="btn btn--talk" id="talk-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg>
        Talk to Someone
      </button>
      <div class="nav__row">
        <button class="chip-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg>
          <span id="theme-label">Dark</span>
        </button>
        <button class="chip-btn" id="install-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-install"/></svg>
          Install
        </button>
      </div>
      <p class="nav__powered">
        Powered by <strong>Zuporta&nbsp;Connect™</strong><br>
        <a href="https://zuporta.com" target="_blank" rel="noopener noreferrer">A Zuporta product · zuporta.com</a>
      </p>
    </div>
  </aside>

  <!-- ───────────────────────── main column ───────────────────────── -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__menu" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <h1 class="topbar__title" id="view-title">Home</h1>
      <button class="icon-btn topbar__talk" id="talk-btn-top" type="button" aria-label="Talk to a professional">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg>
      </button>
    </header>

    <div class="install-banner" id="install-banner" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="install-banner__icon"><use href="#i-install"/></svg>
      <p class="install-banner__text" id="install-banner-text">Add Zuporta+ to your home screen</p>
      <button class="btn btn--sm" id="install-banner-btn" type="button">Install</button>
      <button class="icon-btn install-banner__x" id="install-banner-x" type="button" aria-label="Dismiss">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>

    <main class="view" id="view" tabindex="-1"></main>

    <!-- assistant composer, only shown on the assistant view -->
    <div class="composer-zone" id="composer-zone" hidden>
      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="composer-input">Tell Zuporta+ what is going on</label>
        <textarea id="composer-input" class="composer__input" rows="1" placeholder="Tell Zuporta+ what's going on…" enterkeyhint="send"></textarea>
        <button class="send-btn" id="send-btn" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-send"/></svg>
        </button>
      </form>
      <p class="disclaimer">
        Zuporta offers <strong>wellness support</strong> — not diagnosis, therapy or medical care.
        In an emergency, contact your local emergency number.
      </p>
    </div>

    <!-- mobile tab bar -->
    <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  </div>
</div>

<!-- sheet / dialog host -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-sheet-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__grab" aria-hidden="true"></div>
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheet-title">Title</h2>
      <button class="icon-btn" type="button" aria-label="Close" data-sheet-close>
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>
